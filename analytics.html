<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Analytics - Wealthwise</title>
    <script src="theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <script src="load-page.js"></script>
</head>
<body>
    <header class="mobile-header">
        <div class="brand"><div class="brand-icon"><i class="ph ph-wallet"></i></div><span class="brand-text">Wealthwise</span></div>
        <button class="icon-btn" onclick="ThemeManager.setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')"><i class="ph ph-moon"></i></button>
    </header>

    <aside class="sidebar no-scrollbar" id="sidebar">
        <div class="brand-header">
            <div class="brand"><div class="brand-icon"><i class="ph ph-wallet"></i></div><span class="brand-text">Wealthwise</span></div>
            <button class="collapse-btn" id="sidebarToggle"><i class="ph ph-caret-left"></i></button>
        </div>
        <div class="nav-section">
            <div class="nav-title">Overview</div>
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item"><i class="ph ph-squares-four"></i> <span>Dashboard</span></a>
                <a href="transaction.html" class="nav-item"><i class="ph ph-receipt"></i> <span>Transactions</span></a>
                <a href="analytics.html" class="nav-item active"><i class="ph-fill ph-chart-line-up"></i> <span>Analytics</span></a>
            </div>
        </div>
        <div class="nav-section">
            <div class="nav-title">Settings</div>
            <div class="nav-items"><a href="settings.html" class="nav-item"><i class="ph ph-gear"></i> <span>Preferences</span></a></div>
        </div>
    </aside>

    <main class="dashboard-wrapper">
        <div class="dashboard-scroll-area no-scrollbar">
            <header class="dashboard-header">
                <div class="header-left"><h1>Analytics</h1><p>Understand where your money goes.</p></div>
            </header>

            <div class="settings-card" style="margin-bottom: 24px;">
                <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-light);">EXPENSES BY CATEGORY</h3>
                <div id="categoryBreakdownContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
        </div>
    </main>

    <div class="mobile-nav-dock">
        <nav class="mobile-floating-pill">
            <a href="dashboard.html"><i class="ph ph-squares-four"></i><span>Overview</span></a>
            <a href="transaction.html"><i class="ph ph-receipt"></i><span>Records</span></a>
            <a href="analytics.html" class="active"><i class="ph-fill ph-chart-line-up"></i><span>Analytics</span></a>
            <a href="settings.html"><i class="ph ph-gear"></i><span>Settings</span></a>
        </nav>
        <button id="mobileLogBtn" class="floating-fab-btn"><i class="ph ph-plus"></i></button>
    </div>

    <!-- Reused Modal Structure -->
    <div id="logSheetOverlay" class="sheet-overlay">
        <div class="modal-card bottom-sheet">
            <div class="drag-handle-wrapper mobile-only"><div class="drag-handle"></div></div>
            <div class="modal-header">
                <h2>Add Transaction</h2>
                <button class="close-btn" id="closeLogBtn" type="button"><i class="ph ph-x"></i></button>
            </div>
            <form id="logForm">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-row">
                    <div class="form-group"><label>Date</label><input type="date" id="logDate" required></div>
                    <div class="form-group"><label>Time</label><input type="time" id="logTime" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Type</label>
                        <select id="logType" required><option value="expense">Expense</option><option value="income">Income</option></select>
                    </div>
                    <div class="form-group"><label>Amount</label><input type="number" id="logAmount" step="0.01" required></div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="logCategory">
                        <option value="Salary">Salary</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Housing">Housing</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group"><label>Notes</label><textarea id="logNotes" class="responsive-textarea"></textarea></div>
                <button type="submit" class="btn-submit">Save Transaction</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
